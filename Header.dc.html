<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}a{text-decoration:none;color:inherit}button{font-family:inherit}</style>
</helmet>
<header style="position:sticky;top:0;z-index:60;background:rgba(250,250,247,.9);backdrop-filter:blur(12px);border-bottom:2px solid #141414;font-family:Inter,sans-serif;">
  <div style="max-width:1200px;margin:0 auto;padding:14px clamp(20px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:20px;height:62px;">
    <a href="Automind%20Home.dc.html" style="display:flex;align-items:center;gap:11px;">
      <svg viewBox="0 0 32 32" width="30" height="30" fill="none" style="flex:0 0 auto;">
        <line x1="16" y1="6" x2="6" y2="27" stroke="#D6402C" stroke-width="2.2"/>
        <line x1="16" y1="6" x2="26" y2="27" stroke="#D6402C" stroke-width="2.2"/>
        <line x1="10.5" y1="17" x2="21.5" y2="17" stroke="#D6402C" stroke-width="2.2"/>
        <circle cx="16" cy="6" r="3.2" fill="#D6402C"/><circle cx="6" cy="27" r="3.2" fill="#D6402C"/><circle cx="26" cy="27" r="3.2" fill="#D6402C"/>
      </svg>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.01em;color:#141414;">automind</span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:30px;">
        <sc-for list="{{ links }}" as="n" hint-placeholder-count="4">
          <a href="{{ n.href }}" style="font-size:15px;font-weight:{{ n.weight }};color:{{ n.color }};">{{ n.label }}</a>
        </sc-for>
        <a href="{{ wa }}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:9px;background:#D6402C;color:#FAFAF7;font-weight:600;font-size:14.5px;padding:11px 18px;" style-hover="background:#B23520;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#FAFAF7"><path d="M12 2a10 10 0 00-8.5 15.2L2 22l4.9-1.4A10 10 0 1012 2zm4.4 12c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5L9 6.8c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3a3 3 0 00-.9 2.2c0 1.3 1 2.6 1.1 2.8 0 .2 1.8 2.9 4.5 4 .6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.2.2-.6.2-1 .1-1.2 0-.1-.2-.2-.4-.3z"/></svg>
          Falar no WhatsApp
        </a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}">
      <button onClick="{{ toggleMenu }}" aria-label="Menu" style="display:flex;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;">
        <span style="width:24px;height:2px;background:#141414;display:block;"></span>
        <span style="width:24px;height:2px;background:#141414;display:block;"></span>
        <span style="width:24px;height:2px;background:#141414;display:block;"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}">
    <div style="background:#FAFAF7;padding:8px clamp(20px,4vw,40px) 20px;display:flex;flex-direction:column;font-family:Inter,sans-serif;">
      <sc-for list="{{ links }}" as="n" hint-placeholder-count="4">
        <a href="{{ n.href }}" onClick="{{ closeMenu }}" style="padding:14px 0;border-bottom:1px solid #E4E1D8;font-weight:{{ n.weight }};font-size:16px;color:{{ n.color }};">{{ n.label }}</a>
      </sc-for>
      <a href="{{ wa }}" target="_blank" rel="noopener" style="margin-top:16px;display:inline-flex;align-items:center;gap:9px;background:#D6402C;color:#FAFAF7;font-weight:600;font-size:15px;padding:14px 18px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#FAFAF7"><path d="M12 2a10 10 0 00-8.5 15.2L2 22l4.9-1.4A10 10 0 1012 2zm4.4 12c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5L9 6.8c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3a3 3 0 00-.9 2.2c0 1.3 1 2.6 1.1 2.8 0 .2 1.8 2.9 4.5 4 .6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.2.2-.6.2-1 .1-1.2 0-.1-.2-.2-.4-.3z"/></svg>
        Falar no WhatsApp
      </a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;servicos&quot;, &quot;cases&quot;, &quot;sobre&quot;, &quot;contato&quot;], &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;whatsappNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;5521999789428&quot;, &quot;tsType&quot;: &quot;string&quot;}
}">
class Component extends DCLogic {
  state = { isMobile: false, menuOpen: false };
  componentDidMount() {
    this._mq = window.matchMedia('(max-width: 860px)');
    this._upd = () => this.setState({ isMobile: this._mq.matches, menuOpen: false });
    this._upd();
    this._mq.addEventListener('change', this._upd);
  }
  componentWillUnmount() { if (this._mq) this._mq.removeEventListener('change', this._upd); }
  renderVals() {
    const active = this.props.active || '';
    const num = String(this.props.whatsappNumber || '5521999789428').replace(/\D/g, '');
    const wa = 'https://wa.me/' + num + '?text=' + encodeURIComponent('Olá! Vim pelo site da Automind e quero automatizar meu atendimento.');
    const mk = (k, label, href) => ({ label, href, color: active === k ? '#D6402C' : '#141414', weight: active === k ? '600' : '500' });
    return {
      isMobile: this.state.isMobile,
      isDesktop: !this.state.isMobile,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      wa,
      links: [
        mk('servicos', 'Serviços', 'Servicos.dc.html'),
        mk('cases', 'Cases', 'Cases.dc.html'),
        mk('sobre', 'Sobre', 'Sobre.dc.html'),
        mk('contato', 'Contato', 'Contato.dc.html')
      ]
    };
  }
}
</script>
</body>
</html>
